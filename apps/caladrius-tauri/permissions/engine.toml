# The one permission of the application: the window may call the command `engine_execute`.
# Written by hand because `tauri-build` cannot generate it here (a build script is not allowed to write
# into the source tree on the machines this was built on); `capabilities/default.json` lists it.
[[permission]]
identifier = "allow-engine-execute"
description = "Allows the window to call the engine through the command engine_execute."
commands.allow = ["engine_execute"]
