[package]
name = "xtask"
description = "Caladrius developer tasks: `cargo xtask layers`, `lint`, `wasm` and `conformance`."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# `conformance` runs the engine on the oracle cases through the test kit.
caladrius-nca = { path = "../crates/caladrius-nca" }
caladrius-testkit = { path = "../crates/caladrius-testkit" }
caladrius-models = { path = "../crates/caladrius-models" }
caladrius-fit = { path = "../crates/caladrius-fit" }
# `digest` runs a fixed workload through the engine and fingerprints what it returns.
caladrius-engine = { path = "../crates/caladrius-engine" }
caladrius-digest = { path = "../crates/caladrius-digest" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# The same pure Rust exp and log as the engine, for the formulas the conformance table re-checks.
libm = "=0.2.16"
toml = { version = "1.1.7", default-features = false, features = ["std", "serde", "parse"] }

[lints]
workspace = true
