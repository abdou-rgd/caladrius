[package]
name = "caladrius-engine"
description = "Layer L2: command registry, history and export."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
caladrius-project = { path = "../caladrius-project" }
caladrius-nca = { path = "../caladrius-nca" }
caladrius-models = { path = "../caladrius-models" }
caladrius-fit = { path = "../caladrius-fit" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# Pure Rust exp, log, pow...: the same bits on every platform (clippy.toml bans the standard library's).
# Pinned: another version may round another way, and every digest would change.
libm = "=0.2.16"

[lints]
workspace = true
