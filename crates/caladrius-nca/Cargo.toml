[package]
name = "caladrius-nca"
description = "Layer L0: non-compartmental analysis (AUC rules, lambda_z, extrapolation, AUMC, MRT, CL/F, Vz/F, Vss)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Options, inputs, results and errors are data (golden rule 4): they must serialize.
serde = { version = "1.0.229", features = ["derive"] }
# Pure Rust exp, log, pow...: the same bits on every platform (clippy.toml bans the standard library's).
# Pinned: another version may round another way, and every digest would change.
libm = "=0.2.16"

[dev-dependencies]
caladrius-testkit = { path = "../caladrius-testkit" }
# Exact float round trip, for the serialization tests.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[lints]
workspace = true
