[package]
name = "caladrius-models"
description = "Layer L0: closed-form pharmacokinetic model solutions (bolus, infusion, first- and zero-order absorption, lag time)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Inputs, outputs and errors are data (golden rule 4).
serde = { version = "1.0.229", features = ["derive"] }
# Pure Rust exp, log, pow...: the same bits on every platform (clippy.toml bans the standard library's).
# Pinned: another version may round another way, and every digest would change.
libm = "=0.2.16"

[dev-dependencies]
caladrius-testkit = { path = "../caladrius-testkit" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[lints]
workspace = true
